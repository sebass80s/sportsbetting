name: Update upcoming fixtures
on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * *'
permissions:
  contents: write
concurrency:
  group: upcoming-fixtures
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch upcoming Premier League fixtures
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python scripts/update_upcoming_fixtures.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/upcoming_fixtures.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: update upcoming fixtures"
            git push
          fi
